name: YouTube durum

on:
  workflow_dispatch:
    inputs:
      ids: {description: "virgulle video id'leri", required: true}

jobs:
  durum:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -q google-api-python-client google-auth
      - name: Herkese acik kontrol
        env:
          IDS: ${{ github.event.inputs.ids }}
        run: |
          pip install -q "yt-dlp[default,curl-cffi]"
          for id in $(echo "$IDS" | tr ',' ' '); do
            echo "== $id"
            echo "oembed (200=herkese acik): $(curl -s -o /dev/null -w '%{http_code}' "https://www.youtube.com/oembed?url=https://www.youtube.com/shorts/$id&format=json")"
            yt-dlp -q --skip-download --ignore-no-formats-error --extractor-args "youtube:player_client=mweb" --print "durum=%(availability)s izlenme=%(view_count)s begeni=%(like_count)s yas=%(age_limit)s" "https://www.youtube.com/shorts/$id" 2>&1 | tail -2
          done
