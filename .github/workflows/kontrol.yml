name: Kurulum kontrol

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Secret'lar ve baglantilar
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REDIRECT_URI: ${{ secrets.TIKTOK_REDIRECT_URI }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          for v in YT_CLIENT_ID YT_CLIENT_SECRET YT_REFRESH_TOKEN TIKTOK_CLIENT_KEY TIKTOK_CLIENT_SECRET TIKTOK_REDIRECT_URI TIKTOK_REFRESH_TOKEN GH_PAT; do
            val="${!v}"; trimmed="$(echo -n "$val" | tr -d '[:space:]')"
            if [ -z "$val" ]; then s="YOK"; elif [ "$val" != "$trimmed" ]; then s="VAR (UYARI: bosluk/satir sonu iceriyor)"; else s="VAR (${#val} karakter)"; fi
            echo "$v: $s"
          done
          echo "REDIRECT dogru mu: $([ "$TIKTOK_REDIRECT_URI" = "https://roundershak.github.io/appleshortcutdownloader/tiktok.html" ] && echo EVET || echo HAYIR)"
          echo "--- GH_PAT secret yazma izni"
          GH_TOKEN="$GH_PAT" gh api "repos/$GITHUB_REPOSITORY/actions/secrets/public-key" --jq '"GH_PAT: TAMAM (secret erisimi var)"' 2>&1 | tail -1
          echo "--- TikTok anahtar testi"
          curl -sS -X POST https://open.tiktokapis.com/v2/oauth/token/ -H "Content-Type: application/x-www-form-urlencoded" \
            --data-urlencode "client_key=$TIKTOK_CLIENT_KEY" --data-urlencode "client_secret=$TIKTOK_CLIENT_SECRET" \
            --data-urlencode "grant_type=client_credentials" | jq -r 'if .access_token then "TikTok anahtarlari: TAMAM" else "TikTok anahtarlari HATA: \(.error) \(.error_description)" end'
          echo "--- TikTok giris linki"
          enc=$(jq -rn --arg u "$TIKTOK_REDIRECT_URI" '$u|@uri')
          echo "https://www.tiktok.com/v2/auth/authorize/?client_key=${TIKTOK_CLIENT_KEY}&scope=user.info.basic,video.upload,video.publish&response_type=code&redirect_uri=${enc}&state=klipbot"
