<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TikTok bağlantısı</title>
<style>body{font-family:system-ui,sans-serif;max-width:680px;margin:40px auto;padding:0 16px;line-height:1.6;color:#222;background:#fff}
code{display:block;word-break:break-all;background:#f1f3f4;padding:12px;border-radius:8px;font-size:15px}button{margin-top:12px;padding:10px 16px;font-size:16px}</style></head>
<body><h1>TikTok yetki kodu</h1><div id="o">Kod bulunamadı.</div>
<script>
var p=new URLSearchParams(location.search),c=p.get('code'),e=p.get('error');
var o=document.getElementById('o');
if(c){o.innerHTML='<p>Bu kodu kopyala ve 10 dakika içinde GitHub\'da <b>TikTok bağla</b> iş akışına yapıştır:</p><code id="c"></code><button onclick="navigator.clipboard.writeText(document.getElementById(\'c\').textContent);this.textContent=\'Kopyalandı\'">Kopyala</button>';document.getElementById('c').textContent=c;}
else if(e){o.textContent='Hata: '+e+' '+(p.get('error_description')||'');}
</script></body></html>
